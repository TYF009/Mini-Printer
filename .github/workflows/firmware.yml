name: Firmware
on:
  push:
    paths: ['software/firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['software/firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Host protocol and queue regression tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I software/firmware/src software/firmware/tests/protocol_test.cpp -o /tmp/foli-protocol-tests
          /tmp/foli-protocol-tests
      - name: Install pinned build tool
        run: python -m pip install platformio==6.2.0
      - name: Compile ESP32 firmware
        run: pio run --project-dir software/firmware
