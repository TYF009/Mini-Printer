name: Android

on:
  push:
    paths: ['software/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['software/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: software/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-32' 'build-tools;30.0.3'
      - name: Host protocol and failure-boundary checks
        run: python test-host.py
      - name: Build and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foli-android-debug
          path: |
            software/android/app/build/outputs/apk/debug/app-debug.apk
            software/android/app/build/reports/lint-results-debug.html
